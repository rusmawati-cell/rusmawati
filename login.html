<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - InfoPublik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-building"></i> InfoPublik</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="layanan.html">Layanan</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5">
    <div class="container d-flex justify-content-center">
      <div class="kotak-form w-100">
        <div class="text-center mb-4">
          <i class="bi bi-person-circle" style="font-size:4rem;color:var(--warna-utama)"></i>
          <h2 class="fw-bold mt-2">Login</h2>
          <p class="text-muted">Masuk untuk mengakses layanan</p>
        </div>

        <div id="pesanLogin"></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="nama@gmail.com">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter">
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p class="text-center mt-3 mb-0"><a href="index.html">&larr; Kembali ke Beranda</a></p>
      </div>
    </div>
  </section>

  <footer class="py-4">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 InfoPublik - Layanan Informasi Publik</p>
      <small>
        <a href="index.html">Beranda</a> |
        <a href="layanan.html">Layanan</a> |
        <a href="tentang.html">Tentang</a> |
        <a href="login.html">Login</a>
      </small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
